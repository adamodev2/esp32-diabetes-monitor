name: Build ESP32 firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Set firmware version
        id: firmware_version
        shell: bash
        run: |
          # f565fea is the last main commit carrying the 1.0.43 release.
          # Count only main's first-parent commits so a feature branch's
          # internal commits never bump the release number.
          BASE_COMMIT=f565fea6a591e6ed23527ed4e840c81ed295df97
          BASE_VERSION=$(git show "$BASE_COMMIT:src/main.cpp" | sed -n 's/^#define BUILD_VERSION "\([^"]*\)"/\1/p')
          if [[ ! "$BASE_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid base firmware version: $BASE_VERSION" >&2
            exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}
          MINOR=${BASH_REMATCH[2]}
          PATCH=${BASH_REMATCH[3]}
          git fetch --no-tags origin main:refs/remotes/origin/main
          MAIN_SHA=$(git rev-parse refs/remotes/origin/main)
          git merge-base --is-ancestor "$BASE_COMMIT" "$MAIN_SHA"
          RELEASE_PATCH=$((PATCH + $(git rev-list --first-parent --count "$BASE_COMMIT..$MAIN_SHA")))
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            VERSION="$MAJOR.$MINOR.$RELEASE_PATCH"
          else
            VERSION="$MAJOR.$MINOR.$((RELEASE_PATCH + 1)).dev${GITHUB_RUN_NUMBER}"
          fi
          sed -i -E "s/^#define BUILD_VERSION \"[^\"]*\"$/#define BUILD_VERSION \"$VERSION\"/" src/main.cpp
          grep -Fx "#define BUILD_VERSION \"$VERSION\"" src/main.cpp
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build firmware
        run: pio run

      - name: Collect firmware files
        run: |
          mkdir -p dist
          cp .pio/build/esp32-s3-devkitc-1/bootloader.bin dist/
          cp .pio/build/esp32-s3-devkitc-1/partitions.bin dist/
          cp .pio/build/esp32-s3-devkitc-1/firmware.bin dist/

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: esp32-diabetes-monitor-firmware-v${{ steps.firmware_version.outputs.version }}
          path: dist/*.bin
          if-no-files-found: error
          retention-days: 30
